<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เกมทดสอบคำถามบอลโลก</title>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(180deg, #08316a 0%, #04172e 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 640px;
      background: rgba(12, 33, 82, 0.95);
      border-radius: 24px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.4);
      overflow: hidden;
    }
    .header {
      padding: 28px 24px 18px;
      text-align: center;
      background: rgba(255, 255, 255, 0.05);
    }
    .header h1 {
      margin: 0 0 10px;
      font-size: 2rem;
    }
    .header p {
      margin: 0;
      color: #bdd8ff;
    }
    .content {
      padding: 24px;
    }
    .question-box {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 18px;
      padding: 20px;
    }
    .question-number {
      margin: 0 0 10px;
      color: #aac9ff;
      font-weight: 600;
    }
    .question-text {
      margin: 0 0 20px;
      font-size: 1.2rem;
      line-height: 1.5;
    }
    .choices {
      display: grid;
      gap: 12px;
    }
    button {
      width: 100%;
      padding: 14px 18px;
      border: none;
      border-radius: 14px;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      text-align: left;
      background: rgba(255,255,255,0.1);
      color: #f8f9ff;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    }
    .btn-next {
      margin-top: 18px;
      width: auto;
      background: #1d79ff;
      color: #fff;
      font-weight: 700;
    }
    .status {
      margin-top: 22px;
      padding: 18px;
      border-radius: 18px;
      background: rgba(255,255,255,0.08);
      color: #d8e9ff;
      min-height: 100px;
    }
    .status p {
      margin: 10px 0;
    }
    .footer {
      padding: 18px 24px 24px;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }
    .score {
      color: #cfe3ff;
      font-weight: 600;
    }
    .btn-reset {
      padding: 12px 18px;
      border-radius: 14px;
      border: none;
      background: #ff4949;
      color: #fff;
      cursor: pointer;
      transition: transform 0.15s ease;
    }
    .btn-reset:hover {
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <h1>เกมตอบคำถามบอลโลก</h1>
      <p>ตอบคำถามบอลโลกง่าย ๆ แล้วดูคะแนนของคุณตอนสิ้นสุดเกม</p>
    </div>
    <div class="content">
      <div class="question-box">
        <p class="question-number" id="questionNumber">คำถาม 1 / 5</p>
        <h2 class="question-text" id="questionText">กำลังโหลดคำถาม...</h2>
        <div class="choices" id="choices"></div>
      </div>

      <div class="status" id="statusBox">
        <p id="statusMessage">เลือกตัวเลือกด้านบนเพื่อเริ่มเล่น</p>
        <p class="score">คะแนนปัจจุบัน: <span id="scoreCount">0</span></p>
      </div>
    </div>
    <div class="footer">
      <button class="btn-next" id="nextButton" onclick="nextQuestion()" disabled>คำถามถัดไป</button>
      <button class="btn-reset" onclick="resetGame()">เริ่มใหม่</button>
    </div>
  </div>

  <script>
    const questions = [
      {
        question: 'บอลโลกจัดขึ้นทุกกี่ปี?',
        choices: ['2 ปี', '4 ปี', '5 ปี', '6 ปี'],
        answer: 1
      },
      {
        question: 'ทีมใดชนะบอลโลกมากที่สุด?',
        choices: ['เยอรมนี', 'อาร์เจนตินา', 'บราซิล', 'ฝรั่งเศส'],
        answer: 2
      },
      {
        question: 'ใครเป็นเจ้าภาพบอลโลกปี 2018?',
        choices: ['รัสเซีย', 'บราซิล', 'ญี่ปุ่น', 'แอฟริกาใต้'],
        answer: 0
      },
      {
        question: 'คะแนนสำหรับการชนะในเวลาปกติคือ?',
        choices: ['2 คะแนน', '3 คะแนน', '1 คะแนน', '4 คะแนน'],
        answer: 1
      },
      {
        question: 'บอลโลกครั้งแรกจัดขึ้นปีใด?',
        choices: ['1930', '1950', '1920', '1960'],
        answer: 0
      }
    ];

    let currentIndex = 0;
    let score = 0;
    let answered = false;

    const questionNumber = document.getElementById('questionNumber');
    const questionText = document.getElementById('questionText');
    const choicesEl = document.getElementById('choices');
    const statusMessage = document.getElementById('statusMessage');
    const scoreCount = document.getElementById('scoreCount');
    const nextButton = document.getElementById('nextButton');

    function loadQuestion() {
      answered = false;
      nextButton.disabled = true;
      nextButton.textContent = 'คำถามถัดไป';
      const current = questions[currentIndex];
      questionNumber.textContent = `คำถาม ${currentIndex + 1} / ${questions.length}`;
      questionText.textContent = current.question;
      choicesEl.innerHTML = '';
      statusMessage.textContent = 'เลือกคำตอบที่คุณคิดว่าถูกต้อง';

      current.choices.forEach((choice, index) => {
        const btn = document.createElement('button');
        btn.textContent = choice;
        btn.onclick = () => selectChoice(index);
        choicesEl.appendChild(btn);
      });
    }

    function selectChoice(index) {
      if (answered) return;
      answered = true;
      nextButton.disabled = false;
      const current = questions[currentIndex];
      const buttons = choicesEl.querySelectorAll('button');

      buttons.forEach((btn, btnIndex) => {
        btn.disabled = true;
        if (btnIndex === current.answer) {
          btn.style.background = '#3a86ff';
          btn.style.color = '#fff';
        } else if (btnIndex === index) {
          btn.style.background = '#ff5d5d';
          btn.style.color = '#fff';
        }
      });

      if (index === current.answer) {
        score += 1;
        statusMessage.textContent = 'ถูกต้อง! ดีมาก';
      } else {
        statusMessage.textContent = `ผิด! คำตอบที่ถูกคือ ${current.choices[current.answer]}`;
      }

      scoreCount.textContent = score;
      if (currentIndex === questions.length - 1) {
        nextButton.textContent = 'ดูผลลัพธ์';
      }
    }

    function nextQuestion() {
      if (!answered) return;
      if (currentIndex < questions.length - 1) {
        currentIndex += 1;
        loadQuestion();
      } else {
        showResult();
      }
    }

    function showResult() {
      questionNumber.textContent = 'จบเกมแล้ว';
      questionText.textContent = 'คุณตอบคำถามเสร็จเรียบร้อยแล้ว';
      choicesEl.innerHTML = '';
      statusMessage.innerHTML = `คะแนนรวม: <strong>${score}</strong> จาก ${questions.length} ข้อ<br>ขอบคุณที่เล่น!`;
      nextButton.disabled = true;
      nextButton.textContent = 'เริ่มใหม่หากต้องการ';
    }

    function resetGame() {
      currentIndex = 0;
      score = 0;
      scoreCount.textContent = '0';
      loadQuestion();
    }

    loadQuestion();
  </script>
</body>
</html>
